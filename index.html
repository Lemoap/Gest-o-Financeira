<head>

  <!DOCTYPE html>
  <html lang="pt-BR">

  <head>
    <meta charset="UTF-8">
    <title>Gestão Financeira</title>
  </head>

<body>
  <h1>Minhas Finanças</h1>

  <!-- Formulário de cadastro -->
  <form id="form-transacao">
    <div>
      <label>Descrição:</label>
      <input type="text" id="desc" required placeholder="Ex: Salário, Aluguel...">
    </div>
    <div>
      <label>Valor (R$):</label>
      <input type="number" step="0.01" id="valor" required placeholder="0.00">
    </div>
    <div>
      <label>Tipo:</label>
      <select id="tipo">
        <option value="receita">Receita</option>
        <option value="despesa">Despesa</option>
      </select>
    </div>
    <div>
      <label>Data:</label>
      <input type="date" id="data" required>
    </div>
    <button type="submit">Salvar Transação</button>
  </form>

  <h2>Extrato</h2>
  <ul id="lista-transacoes"></ul>

  <!-- Carrega a biblioteca do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Carrega o seu script principal -->
  <script src="app.js"></script>
</body>

</html>
</head>
